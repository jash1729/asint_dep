_schema-version: "3.3"
ID: asint-ais
version: 0.0.1

modules:
  - name: asint-ais-srv
    type: nodejs
    path: .
    parameters:
      memory: 512M
      disk-quota: 1024M
      instances: 1
    requires:
      - name: asint-db
    properties:
      CDS_DEBUG: "true"

resources:
  - name: asint-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared