name: DEP_CHECK

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build:
    name: Build Dep Repo
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594
        with:
          egress-policy: audit
          allowed-endpoints: |

            # GitHub
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            objects-origin.githubusercontent.com:443
            uploads.github.com:443
            github-releases.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            hosted-compute-watchdog-prod-iad-01.githubapp.com:443

            # Maven
            repo.maven.apache.org:443
            repo1.maven.org:443

            # Node / NPM
            registry.npmjs.org:443
            nodejs.org:443

            # SAP
            tools.hana.ondemand.com:443

            # Java
            api.adoptium.net:443

            # Ubuntu
            deb.debian.org:443
            security.ubuntu.com:443
            archive.ubuntu.com:443


      # CHECKOUT
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NODE
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check node version
        run: node --version

      # JAVA
      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'

      - name: Check mvn version
        run: mvn --version

      - name: Install MTA Build Tool
        run: npm install -g mbt

      - name: Install Packages
        run: npm install ci

      - name: Disable package-lock.json
        run: npm config set package-lock false

      - name: Build MTA
        run: npm run build

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            google-chrome-stable \
            libgtk-3-0 \
            libgbm-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libxtst6 \
            xvfb

      - name: Install E2E dependencies
        working-directory: asint_ais_e2e
        run: npm ci


      # TESTS
      - name: Run Tests
        run: npm test
        continue-on-error: true
